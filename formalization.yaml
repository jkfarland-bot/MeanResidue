# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "MeanResidue: mean quadratic residues, floor sums of square roots and the conjectures of Chamberland and Dilcher"
  description: >-
    For n >= 1 let S_n be the mean of the least residues of the squares modulo n and
    f(n) = sum_{j <= n/4} floor(sqrt(jn)) - (n^2 - 1)/12. Chamberland and Dilcher (arXiv:2510.04387)
    evaluated f(p) through class numbers and stated five conjectures for composite n. The development
    proves, for every n, the reduction of f(n) to S_n and s(n) = #{k < n : n | k^2} in the four
    classes of n modulo 4 (lattice points under the parabola and the pairing k -> n - k); for every
    odd squarefree n, that the number of square roots of b modulo n is the sum of the Jacobi symbols
    (b/d) over the divisors d of n; and from these, for every odd squarefree n, the formula
    (n - 1)/2 - S_n = sum over the divisors d = 3 (mod 4) of hB(d) = -(1/d) sum_{a<d} a (a/d). It
    derives Conjectures 7.3 and 7.4 of Chamberland and Dilcher, their formulas (7.3) and (7.4) for
    n = pq, Bunyakovsky's identity f(p) = 0 for p = 1 (mod 4), and their Proposition 1.2, all with the
    class number h*(-d) in its Bernoulli form hB(d).
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A15", "11R29", "11L05", "68V20"]

sources:
  - title: "Mean quadratic residues, floor sums of square roots, and class numbers: the conjectures of Chamberland and Dilcher"
    authors:
      - "Joseph S. Farland"
    type: "article"
    location: "Unpublished manuscript (draft), 2026"
    relationship: "formalizes"
    note: >-
      The draft proves the conjectures for every n (Theorems 1.1 and 1.2). Formalized: Theorem 1.2
      relative to S_n for every n; Theorem 1.1 for odd squarefree n in Bernoulli form; Conjectures 7.3
      and 7.4, the formulas (7.3) and (7.4), Bunyakovsky's identity and Proposition 1.2 of
      Chamberland and Dilcher, in Bernoulli form. Not formalized: Dirichlet's class number formula
      hB(d) = h*(-d) (quoted); Theorem 1.1 for non-squarefree or even n, and with it Conjectures 7.1
      and 7.2; Conjecture 7.5, which also needs a class-number bound.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Jacobi forms and a certain space of modular forms"
    authors:
      - "N.-P. Skoruppa"
      - "D. Zagier"
    type: "article"
    location: "Invent. Math. 94 (1988), 113-146"
    relationship: "background"
    note: "Proposition A.2 with a = 1 is equivalent to the draft's Theorem 1.1 (the mean residue S_n through Hurwitz class numbers); the formalization proves the odd squarefree case by an elementary argument."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "OEIS A048153: a(n) = Sum_{k=1..n} (k^2 mod n)"
    authors:
      - "OEIS contributors (formula by O. Kutal, 2026)"
    type: "other"
    location: "https://oeis.org/A048153"
    relationship: "background"
    note: "Records the class-number formula for the sum of the residues of the squares modulo n."
    license: "CC-BY-SA-4.0"
    author_endorsement: "n/a"
  - title: "Sums of the floor function related to class numbers of imaginary quadratic fields"
    authors:
      - "M. Chamberland"
      - "K. Dilcher"
    type: "article"
    location: "arXiv:2510.04387"
    relationship: "formalizes"
    note: "Source of the conjectures (Section 7) and of Proposition 1.2; Bunyakovsky's identity is their Proposition 1.1."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Formalized: f(n) in terms of S_n and s(n) for every n; the root count modulo an odd squarefree n;
    (n - 1)/2 - S_n = sum_{d | n, d = 3 (4)} hB(d) for odd squarefree n; Conjectures 7.3 and 7.4 of
    Chamberland and Dilcher, their formulas (7.3) and (7.4), Bunyakovsky's identity and their
    Proposition 1.2, in Bernoulli form; the number 1 + (u/p) of square roots of a unit u modulo p^m for an
    odd prime p. Not formalized: Dirichlet's formula hB(d) = h*(-d);
    non-squarefree and even n; Conjectures 7.1, 7.2 and 7.5.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the draft's statements
        and proofs, compiled locally with lake, and checked with Palomar's lake comparator script.
      cost:
        wall_time: "about two hours"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was asked to formalize the proof of the Chamberland-Dilcher conjectures without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope (the elementary part, with Dirichlet's formula quoted, as in the
    author's earlier formalizations).

fidelity:
  divergences: >-
    The class number h*(-d) appears in its Bernoulli form hB(d) = -(1/d) sum_{a<d} a (a/d) with the
    Jacobi symbol; for squarefree d = 3 (mod 4) the two agree by Dirichlet's class number formula,
    which is quoted. s(n) is defined as the number of square roots of 0 modulo n; the draft's
    description as the largest integer whose square divides n is not formalized (s(n) = 1 for
    squarefree n is). The draft's T(n) appears as defect n = (n - s(n))/2 - S_n.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    Draft: the statements in Challenge.lean have not yet been compared with the paper by the author.
    The definitions in Challenge.lean are copied verbatim from the development and compared by
    Comparator, bodies included (comparator.json lists no definition holes).
