# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "MeanResidue: mean quadratic residues, floor sums of square roots and the conjectures of Chamberland and Dilcher"
  description: >-
    For n >= 1 let S_n be the mean of the least residues of the squares modulo n and
    f(n) = sum_{j <= n/4} floor(sqrt(jn)) - (n^2 - 1)/12. Chamberland and Dilcher (arXiv:2510.04387)
    evaluated f(p) through class numbers and stated five conjectures for composite n. The development
    proves, for every n >= 1, the reduction of f(n) to S_n and s(n) = #{k < n : n | k^2} in the four
    classes of n modulo 4 (lattice points under the parabola and the pairing k -> n - k), and the
    divisor form of the formula for S_n: (n - s(n))/2 - S_n = sum_{d | n} G(d), where G(d) is a
    sawtooth sum of phi_d = sum_{e | d} mu(d/e) cnt(e, .) and cnt(e, b) counts the square roots of b
    modulo e. It proves that G vanishes on d = 1, 2 (mod 4), that G(c) = -(1/c) sum_{a<c} a (-c/a) when
    -c is a fundamental discriminant, and the conductor recursion G(l^2 c) = (l - (-c/l)) G(c) for every
    prime l and every c > 0 with c = 0, 3 (mod 4); with Dirichlet's class number formula and the conductor formula
    (quoted) these give G(c) = h*(-c). It derives Conjectures 7.1 (with the sign of one term
    corrected), 7.2, 7.3 and 7.4 of Chamberland and Dilcher, their formulas (7.3) and (7.4) for n = pq,
    Bunyakovsky's identity f(p) = 0 for p = 1 (mod 4) and their Proposition 1.2, with the class
    numbers in Bernoulli form, and Conjecture 7.5 (the limits of f(n)/n) unconditionally, from the
    bound defect(n)^2 <= n sqrt(n) (1 + log n)^3, proved with the discrete Fourier transform on Z/n,
    explicit Fourier coefficients of the sawtooth and Weyl differencing for the quadratic Gauss sums
    (no class numbers). A second proof of Conjecture 7.5 from the class number bound
    |G(c)| <= C sqrt(c) (1 + log c), stated as a hypothesis, follows the first proof in the note.
    The conjectures have probably been proved before this formalization and its note: Conjecture 7.2 in an
    AI-generated write-up on the Principia Math platform (MathDB problem 370786, 29 September 2026), and,
    according to its listing, all five in a preprint by S. K. Jha posted on ResearchGate on 28 October 2026,
    which the author has not been able to consult. No priority is claimed for the conjectures; the
    contribution here is the machine-checked proof.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A15", "11R29", "11L05", "68V20"]

sources:
  - title: "Mean quadratic residues, floor sums of square roots, and class numbers: the conjectures of Chamberland and Dilcher"
    authors:
      - "Joseph S. Farland"
    type: "article"
    location: "Preprint, Zenodo, 2026, all versions https://doi.org/10.5281/zenodo.24508994 (v1.0: https://doi.org/10.5281/zenodo.24508995)"
    relationship: "formalizes"
    note: >-
      The companion note of this formalization, by the same author. It proves Theorems 1.1 and 1.2 for
      every n >= 1 and derives the conjectures; Section 7 (Table 1) lists the statement of the note that
      each theorem of Challenge.lean formalizes. Formalized: Theorem 1.2 relative to S_n for every
      n >= 1; Theorem 1.1 for every n >= 1 in the form of Propositions 6.2 and 6.8 of the note (its
      second proof: divisor form, the values of G at fundamental discriminants and the conductor
      recursion); Conjectures 7.1 (corrected), 7.2, 7.3 and 7.4, the formulas (7.3) and (7.4),
      Bunyakovsky's identity and Proposition 1.2 of Chamberland and Dilcher, in Bernoulli form;
      Proposition 5.3 of the note and Conjecture 7.5, unconditionally, and Conjecture 7.5 also from a
      class number bound, stated as a hypothesis. Not formalized: Dirichlet's class number formula and
      the conductor formula for orders (quoted), and the note's first (analytic) proof of Theorem 1.1.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Jacobi forms and a certain space of modular forms"
    authors:
      - "N.-P. Skoruppa"
      - "D. Zagier"
    type: "article"
    location: "Invent. Math. 94 (1988), 113-146"
    relationship: "background"
    note: "Proposition A.2 with a = 1 is equivalent to the note's Theorem 1.1 (the mean residue S_n through Hurwitz class numbers); the formalization proves Theorem 1.1 for every n >= 1 by an elementary argument, in divisor form, with Dirichlet's class number formula and the conductor formula quoted."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "OEIS A048153: a(n) = Sum_{k=1..n} (k^2 mod n)"
    authors:
      - "OEIS contributors (formula by O. Kutal, 2026)"
    type: "other"
    location: "https://oeis.org/A048153"
    relationship: "background"
    note: "Records the class-number formula for the sum of the residues of the squares modulo n."
    license: "CC-BY-SA-4.0"
    author_endorsement: "n/a"
  - title: "Sums of the floor function related to class numbers of imaginary quadratic fields"
    authors:
      - "M. Chamberland"
      - "K. Dilcher"
    type: "article"
    location: "arXiv:2510.04387"
    relationship: "formalizes"
    note: "Source of the conjectures (Section 7) and of Proposition 1.2; Bunyakovsky's identity is their Proposition 1.1."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Quadratic remainder sums for two primes congruent to three modulo four"
    authors:
      - "Principia Math (AI-generated write-up)"
    type: "other"
    location: "Principia Math, solution of MathDB problem 370786, dated 29 September 2026, https://principia-math.com"
    relationship: "background"
    note: "An earlier proof of Conjecture 7.2 for all exponents, by counting square roots of units and splitting by the two valuations (the note's second method for two primes). Not formalized there."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    Formalized: f(n) in terms of S_n and s(n) for every n >= 1; square roots modulo prime powers
    (including 2) and modulo odd squarefree n; (n - s(n))/2 - S_n = sum_{d | n} G(d) for every n >= 1,
    with G = 0 on d = 1, 2 (mod 4), G(c) = hK(c) at fundamental discriminants -c and
    G(l^2 c) = (l - (-c/l)) G(c) for every prime l and every c > 0 with c = 0, 3 (mod 4);
    (n - 1)/2 - S_n = sum_{d | n, d = 3 (4)} hB(d) for odd squarefree n; Conjectures 7.1 (corrected),
    7.2, 7.3 and 7.4 of Chamberland and Dilcher, their formulas (7.3) and (7.4), Bunyakovsky's identity
    and their Proposition 1.2, in Bernoulli form; defect(n)^2 <= n sqrt(n) (1 + log n)^3 and
    Conjecture 7.5, unconditionally; Conjecture 7.5 also under the hypothesis
    |G(c)| <= C sqrt(c) (1 + log c). Not formalized: Dirichlet's class number formula and the conductor
    formula (quoted).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the note's statements
        and proofs, compiled locally with lake, and checked with Palomar's lake comparator script.
      cost:
        wall_time: "about two hours (stage one), about five hours (stages two and three) and about two hours (stage four)"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was asked to formalize the proof of the Chamberland-Dilcher conjectures without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope (the elementary part, with Dirichlet's formula quoted, as in the
    author's earlier formalizations).

fidelity:
  divergences: >-
    The class number h*(-c) appears through G(c), which is defined from root counts; the formalization
    proves that G has the base values hK(c) = -(1/c) sum_{a<c} a (-c/a) at fundamental discriminants and
    satisfies the conductor recursion, and Dirichlet's class number formula and the conductor formula
    (quoted) identify G(c) with h*(-c). For squarefree c = 3 (mod 4), hK(c) = hB(c) with the Jacobi
    symbol. The Kronecker symbol (-c/a) is computed with Jacobi symbols ((a/c) for odd c, chi_4(a)(c/a)
    for even c), which agrees with the Kronecker symbol for c = 0, 3 (mod 4). s(n) is defined as the
    number of square roots of 0 modulo n; s(n)^2 | n, s(p^a q^b) = p^floor(a/2) q^floor(b/2) and
    s(n) = 1 for squarefree n are proved. The note's T(n) appears as defect n = (n - s(n))/2 - S_n.
    The note proves Conjecture 7.5 twice (Section 5.3): from a class number bound, and from the
    elementary bound of its Proposition 5.3 (Fourier expansion on Z/n and Weyl differencing).
    conj_7_5 formalizes the second proof; conj_7_5_of_class_number_bound formalizes the first, with the
    class number bound as a hypothesis on G. Theorem 1.2 is false at n = 0 (f(0) = 1/12), so
    f_mod_four_eq_zero assumes n > 0; G_conductor assumes c > 0, since at c = 0 both sides vanish.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The definitions in Challenge.lean are copied verbatim from the development and compared by
    Comparator, bodies included (comparator.json lists no definition holes). Table 1 in Section 7 of
    the note lists the statement of the note that each theorem of Challenge.lean formalizes. The author
    has compared the statements of Challenge.lean with the note and approves them. The scripts in
    numerics/ run numerical checks of selected statements of the note over finite ranges, listed in
    numerics/README.md; they are not part of the formal verification. No external referee has reviewed
    the note or the formalization. Earlier work: Conjecture 7.2 was proved in a Principia Math write-up
    (29 September 2026), and a preprint by S. K. Jha (ResearchGate, 28 October 2026, not consulted) is
    listed as a solution of the conjectures; the note (from version 1.2) says so and claims no priority.

