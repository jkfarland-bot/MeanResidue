status:
  scope: >-
    Formalized: f(n) in terms of S_n and s(n) for every n; square roots modulo prime powers (including
    2) and modulo odd squarefree n; (n - s(n))/2 - S_n = sum_{d | n} G(d) for every n, with G = 0 on
    d = 1, 2 (mod 4), G(c) = hK(c) at fundamental discriminants -c and G(l^2 c) = (l - (-c/l)) G(c);
    (n - 1)/2 - S_n = sum_{d | n, d = 3 (4)} hB(d) for odd squarefree n; Conjectures 7.1 (corrected),
    7.2, 7.3 and 7.4 of Chamberland and Dilcher, their formulas (7.3) and (7.4), Bunyakovsky's identity
    and their Proposition 1.2, in Bernoulli form; Conjecture 7.5 under the hypothesis
    |G(c)| <= C sqrt(c) (1 + log c). Not formalized: Dirichlet's class number formula and the conductor
    formula (quoted); the class number bound (hypothesis of conj_7_5).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the draft's statements
        and proofs, compiled locally with lake, and checked with Palomar's lake comparator script.
      cost:
        wall_time: "about two hours (stage one) and about five hours (stages two and three)"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was asked to formalize the proof of the Chamberland-Dilcher conjectures without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope (the elementary part, with Dirichlet's formula quoted, as in the
    author's earlier formalizations).

fidelity:
  divergences: >-
    The class number h*(-c) appears through G(c), which is defined from root counts; the formalization
    proves that G has the base values hK(c) = -(1/c) sum_{a<c} a (-c/a) at fundamental discriminants and
    satisfies the conductor recursion, and Dirichlet's class number formula and the conductor formula
    (quoted) identify G(c) with h*(-c). For squarefree c = 3 (mod 4), hK(c) = hB(c) with the Jacobi
    symbol. The Kronecker symbol (-c/a) is computed with Jacobi symbols ((a/c) for odd c, chi_4(a)(c/a)
    for even c), which agrees with the Kronecker symbol for c = 0, 3 (mod 4). s(n) is defined as the
    number of square roots of 0 modulo n; s(n)^2 | n, s(p^a q^b) = p^floor(a/2) q^floor(b/2) and
    s(n) = 1 for squarefree n are proved. The draft's T(n) appears as defect n = (n - s(n))/2 - S_n.
    Conjecture 7.5 takes the class number bound as a hypothesis.

